<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recommendation - SkinGuard AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .recommendation-page {

            width: 90%;
            max-width: 1000px;

            margin: 40px auto;

        }

        .recommendation-title {

            text-align: center;

            color: #24146d;

            font-size: 36px;

            margin-bottom: 35px;

        }

        .recommendation-card {

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);

            margin-bottom: 30px;

        }

        .recommendation-card h2 {

            color: #24146d;

            text-align: center;

            margin-bottom: 25px;

        }

        .result-table {

            width: 100%;

            border-collapse: collapse;

        }

        .result-table th {

            background: #24146d;

            color: white;

            padding: 15px;

            text-align: left;

        }

        .result-table td {

            padding: 15px;

            border-bottom: 1px solid #ddd;

        }

        .recommendation-box {

            margin-top: 25px;

            padding: 25px;

            background: #e8f5e9;

            border-left: 6px solid #2e7d32;

            border-radius: 10px;

        }

        .recommendation-box h3 {

            color: #1b5e20;

            margin-bottom: 12px;

        }

        .recommendation-box p {

            font-size: 18px;

            line-height: 1.6;

        }

        .status-box {

            text-align: center;

            background: #f3f0ff;

            padding: 20px;

            border-radius: 10px;

            margin-top: 25px;

        }

        .next-btn {

            width: 320px;

            margin: 35px auto;

        }

        .next-btn button {

            width: 100%;

            padding: 15px;

            background: #24146d;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            cursor: pointer;

        }

        .next-btn button:hover {

            background: #3922a8;

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        <h2>SkinGuard AI</h2>

    </div>

</header>


<div class="recommendation-page">


    <h1 class="recommendation-title">

        Personalized Clinical Recommendation

    </h1>


    <div class="recommendation-card">

        <h2>
            Prediction Summary
        </h2>


        <table class="result-table">

            <tr>

                <th>
                    Disease
                </th>

                <td>
                    {{ disease }}
                </td>

            </tr>


            <tr>

                <th>
                    Confidence
                </th>

                <td>
                    {{ confidence }} %
                </td>

            </tr>


            <tr>

                <th>
                    Severity
                </th>

                <td>
                    {{ severity }}
                </td>

            </tr>

        </table>


        <div class="recommendation-box">

            <h3>
                Recommendation
            </h3>

            <p>
                {{ recommendation }}
            </p>

        </div>


        <div class="status-box">

            <h3>
                {{ status }}
            </h3>

            <p>
                Algorithm Used:
                {{ algorithm }}
            </p>

        </div>

    </div>


    <div class="next-btn">

        <button
            type="button"
            onclick="window.location.href='/report'">

            Report

        </button>

    </div>


</div>


</body>

</html>
